[project]
name = "small-agentic-rag-benchmark"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
